# cross-rs configuration for the R-Audio cross-build.
#
# Slint's skia renderer + librespot pull in a bunch of native C/C++ deps
# (fontconfig, freetype, alsa, ssl, dbus). The default cross image doesn't
# ship the matching `-dev` packages for the x86_64 target, so we extend it
# with pre-build hooks that apt-install them.

[target.x86_64-unknown-linux-gnu]
# Pre-build commands run inside the cross container as root before the
# build script kicks in. We install the same dev libs the GitHub Actions
# workflow installs natively.
pre-build = [
    "dpkg --add-architecture amd64",
    "apt-get update",
    "apt-get install --assume-yes --no-install-recommends \
        libasound2-dev:amd64 \
        libssl-dev:amd64 \
        libdbus-1-dev:amd64 \
        libfontconfig1-dev:amd64 \
        libfreetype-dev:amd64 \
        pkg-config",
]

# Pass through env-vars that cargo build scripts (pkg-config, openssl-sys,
# alsa-sys) use to find the right libs for the target.
[build.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig",
]

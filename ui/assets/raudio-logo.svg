<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glass-like gradient for the circle background -->
    <linearGradient id="glass" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background circle: subtle glass fill -->
  <circle cx="100" cy="100" r="89" fill="url(#glass)"/>

  <!-- R letterform: white -->
  <path

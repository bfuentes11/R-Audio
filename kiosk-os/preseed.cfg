# ==============================================================================
# R-Audio Kiosk — Unattended Debian Installer Preseed
# ==============================================================================
# Loaded by d-i via the kernel argument:
#   auto=true priority=critical preseed/file=/cdrom/preseed.cfg
#
# The official Debian DVD mounts /cdrom early (before preseed loading), so
# /cdrom/preseed.cfg is always reachable — no initrd embedding needed.
#
# WARNING: this preseed WIPES the target machine's first disk. It is intended
# for dedicated kiosk hardware (e.g. a Surface Go 2's internal eMMC).
# ==============================================================================

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network — disabled during install.
# The Surface Go 2 has no built-in Ethernet. Wi-Fi credentials are set up
# by r-audio-setup on first boot. No network is needed to install because
# all packages come from the DVD's on-disc pool.
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string r-audio
d-i netcfg/get_domain string local

### Mirror — point at deb.debian.org but don't use it during install.
# use_mirror=false tells apt-setup not to add the network mirror as an active
# source during installation (all packages come from the DVD). The suite is
# still recorded so the installed system's sources.list is correct once
# r-audio-setup pairs Wi-Fi post-install. mirror/error=ignore silences any
# validation dialog in case d-i attempts a reachability check anyway.
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i mirror/udeb/suite string trixie
d-i apt-setup/use_mirror boolean false
d-i apt-setup/mirror/error select ignore

### Account setup — root disabled, kiosk user with passwordless sudo
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Kiosk User
d-i passwd/username string kiosk
d-i passwd/user-password password kiosk
d-i passwd/user-password-again password kiosk
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean false

### Partitioning — auto-detect first disk (works for /dev/mmcblk0, /dev/nvme0n1, /dev/sda)
d-i partman/early_command string \
    DISK=$(list-devices disk | head -n1); \
    debconf-set partman-auto/disk "$DISK"; \
    debconf-set grub-installer/bootdev "$DISK"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Surface Go 2 is UEFI — allow partman to create an EFI System Partition
d-i partman-efi/non_efi_system boolean false

### Base system
d-i base-installer/install-recommends boolean false

### Apt — install from DVD pool only, no network sources during install.
# postinstall.sh writes a proper sources.list for post-install use.
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

### Package selection
# ------------------------------------------------------------------------------
# MINIMAL package set installed by d-i from the DVD1 pool.
#
# Everything else the kiosk needs (openbox, pulseaudio, onboard,
# bluez-tools, libfontconfig1, libxkbcommon-x11-0, etc.) is bundled as .debs
# in /r-audio-payload/r-audio-debs/ on the ISO and installed by postinstall.sh
# via `dpkg -i` after this step completes. build-iso.sh pre-fetches the
# complete dep tree using a Debian trixie Docker container so versions match
# exactly — same strategy FAI uses.
#
# Rule for what belongs in THIS list: high-confidence DVD1 packages only.
# When in doubt, leave it out and let postinstall.sh install it from the
# bundled .debs instead. Adding the wrong package here breaks the
# "Select and install software" d-i step with no easy recovery.
# ------------------------------------------------------------------------------
tasksel tasksel/first multiselect
d-i pkgsel/include string \
    xserver-xorg xinit xserver-xorg-input-libinput xauth \
    x11-xserver-utils \
    libgl1-mesa-dri \
    alsa-utils \
    avahi-daemon dbus-x11 \
    network-manager wpasupplicant \
    ca-certificates curl wget sudo \
    firmware-misc-nonfree firmware-iwlwifi \
    fonts-dejavu-core
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Bootloader — UEFI with fallback path for Surface firmware
d-i grub-installer/only_debian boolean true
d-i grub-installer/force-efi-extra-removable boolean true

### Finish
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

### Late command — copy payload from DVD and run post-install setup
d-i preseed/late_command string \
    cp /cdrom/r-audio-payload/postinstall.sh /target/tmp/postinstall.sh; \
    chmod +x /target/tmp/postinstall.sh; \
    cp -r /cdrom/r-audio-payload /target/tmp/r-audio-payload; \
    /target/tmp/postinstall.sh

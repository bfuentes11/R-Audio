# ==============================================================================
# R-Audio Kiosk — Unattended Debian Installer Preseed
# ==============================================================================
# This file drives debian-installer non-interactively. The bootloader passes
# `auto=true priority=critical preseed/file=/cdrom/preseed.cfg` on the kernel
# command line, which tells d-i to read this file and skip every question
# that's been answered here.
#
# WARNING: this preseed WIPES the target machine's first disk. It is intended
# to run on dedicated kiosk hardware (e.g. a Surface Go 2's internal eMMC).
# ==============================================================================

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network configuration
# Use whichever interface comes up first. If the eMMC kiosk has no Ethernet,
# d-i may struggle on Wi-Fi during install — the kiosk's own OOBE handles
# Wi-Fi pairing post-install, so we keep this best-effort.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string r-audio
d-i netcfg/get_domain string local
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_timeout string 30
d-i netcfg/link_wait_timeout string 10

### Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account setup — root disabled, kiosk user passwordless via sudoers.d
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Kiosk User
d-i passwd/username string kiosk
d-i passwd/user-password password kiosk
d-i passwd/user-password-again password kiosk
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### Partitioning — auto-detect first disk so this works on /dev/mmcblk0
### (Surface Go 2 eMMC), /dev/nvme0n1, /dev/sda, etc.
d-i partman/early_command string \
    DISK=$(list-devices disk | head -n1); \
    debconf-set partman-auto/disk "$DISK"; \
    debconf-set grub-installer/bootdev "$DISK"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### Base system / apt
d-i base-installer/install-recommends boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

### Package selection — minimal system + everything the kiosk needs
tasksel tasksel/first multiselect
d-i pkgsel/include string \
    xserver-xorg xinit openbox xserver-xorg-input-libinput \
    libgl1-mesa-dri \
    alsa-utils pulseaudio \
    avahi-daemon libavahi-compat-libdnssd1 dbus-x11 \
    network-manager iw wpasupplicant \
    ca-certificates curl wget sudo \
    firmware-misc-nonfree firmware-iwlwifi \
    bluez bluez-tools
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Bootloader — install GRUB on the same disk d-i picked above.
### force-efi-extra-removable installs a fallback bootloader at
### /EFI/BOOT/BOOTX64.EFI so flaky UEFI firmware (Surface) finds it.
d-i grub-installer/only_debian boolean true
d-i grub-installer/force-efi-extra-removable boolean true

### Finishing — eject the install media and reboot without prompting
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

### Late command — copy the R-Audio payload off the ISO and run the
### post-install script that wires up autologin, services, etc.
d-i preseed/late_command string \
    cp /cdrom/r-audio-payload/postinstall.sh /target/tmp/postinstall.sh; \
    chmod +x /target/tmp/postinstall.sh; \
    cp -r /cdrom/r-audio-payload /target/tmp/r-audio-payload; \
    /target/tmp/postinstall.sh

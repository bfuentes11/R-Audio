[package]
name = "R-Audio"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
serde = "1.0.228"
serde_json = "1.0.149"
chrono = { version = "0.4", features = ["serde"] }
slint = { version = "1.16.1", features = ["renderer-skia"] }
# slint = "1.16.1"

tokio = { version = "1.52.2", features = ["full"] }

reqwest = { version = "0.12.3", default-features = false, features = ["native-tls"] }
rspotify = { version = "0.16.1", default-features = false, features = ["client-reqwest", "reqwest-native-tls", "cli", "env-file"] }
dotenvy = "0.15.7"
image = "0.25.10"
urlencoding = "2.1.3"
tiny_http = "0.8.2"
uuid = { version = "1.8.0", features = ["v4"] }

# --- Parked for the UI Visual Slice ---
librespot = "0.4.2"
librespot-core = "0.4.2"
librespot-protocol = "0.4.2"
qrcode-generator = "5.0.0"
rustfft = "6"
lru = "0.12"
# symphonia = "0.5.5"

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "R-Audio"
path = "src/main.rs"

[[bin]]
name = "r-audio-setup"
path = "src/setup/main.rs"


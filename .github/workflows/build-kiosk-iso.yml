name: Build Kiosk ISO

on:
  push:
    branches: [main, librespot-0.4.2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest   # x86_64 — matches the Surface Go 2's Intel CPU

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Rust toolchain ──────────────────────────────────────────────────
      - name: Install Rust (stable, x86_64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── 3. Cache the Debian DVD (4.7 GB — only download once) ─────────────
      # Key includes the Debian version from build-iso.sh so it busts
      # automatically when we change DEBIAN_VERSION.
      - name: Cache Debian trixie DVD1
        uses: actions/cache@v4
        with:
          path: kiosk-os/debian-*-amd64-DVD-1.iso
          key: debian-dvd1-${{ hashFiles('kiosk-os/build-iso.sh') }}

      # ── 4. System build dependencies ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libfontconfig1-dev \
            xorriso \
            wget \
            librsvg2-bin

      # ── 4b. Cache compiled R-Audio binaries ───────────────────────────────
      # When iterating on kiosk-os/* files only, the Rust binaries don't change
      # and we can skip the ~5-10 min cargo build entirely. Cache key covers
      # everything that affects the final binary output.
      - name: Cache release binaries
        id: cache-binaries
        uses: actions/cache@v4
        with:
          path: |
            target/x86_64-unknown-linux-gnu/release/R-Audio
            target/x86_64-unknown-linux-gnu/release/r-audio-setup
          key: r-audio-bins-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'src/**', 'ui/**', 'material-1.0/**') }}

      # ── 4c. Cache the bundled .deb packages ───────────────────────────────
      # build-iso.sh's Docker step downloads ~500 MB of .debs (openbox,
      # plymouth, pulseaudio, etc.) every run. Cache them, keyed on
      # build-iso.sh so any package-list change busts the cache automatically.
      - name: Cache bundled .deb packages
        uses: actions/cache@v4
        with:
          path: ~/r-audio-debs-cache
          key: r-audio-debs-${{ hashFiles('kiosk-os/build-iso.sh') }}

      # ── 5. Compile R-Audio binaries (skipped on cache hit) ────────────────
      - name: Build release binaries
        if: steps.cache-binaries.outputs.cache-hit != 'true'
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Stage binaries where build-iso.sh expects them
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-gnu/release/R-Audio       target/release/R-Audio
          cp target/x86_64-unknown-linux-gnu/release/r-audio-setup target/release/r-audio-setup

      # ── 6. Remaster the Debian DVD into the R-Audio kiosk ISO ─────────────
      # build-iso.sh downloads the official Debian trixie DVD1 (or reuses the
      # cached copy), pre-fetches the kiosk's extra .debs via a Debian trixie
      # Docker container (or reuses the cached .debs at ~/r-audio-debs-cache),
      # then uses xorriso to graft everything onto the ISO.
      # sudo -E preserves R_AUDIO_DEBS_CACHE so build-iso.sh can find the cache.
      - name: Build Kiosk ISO
        working-directory: kiosk-os
        env:
          R_AUDIO_DEBS_CACHE: /home/runner/r-audio-debs-cache
        run: sudo -E bash build-iso.sh
        timeout-minutes: 45

      # ── 7. Setup rclone & Upload to OneDrive ─────────────────────────────
      - name: Install and Configure rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF

      - name: Upload ISO to OneDrive
        run: rclone copy kiosk-os/r-audio-kiosk-trixie.iso onedrive:/SurfaceKioskBuilds/

      # ── 8. On tagged releases, publish as a GitHub Release asset ──────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: kiosk-os/r-audio-kiosk-trixie.iso
          name: R-Audio Kiosk ${{ github.ref_name }}
          body: |
            Bootable Debian Trixie kiosk ISO for the Surface Go 2.
            Flash with Rufus (DD mode) or `dd`.
